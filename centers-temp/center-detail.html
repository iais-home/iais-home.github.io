<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Center Detail - IAIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Public Sans', sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        h1, h2, h3, h4, .font-serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
</head>
<body class="bg-[#FAFBFD] text-gray-800">
    <!-- Header -->
    <div id="header-container"></div>

    <main class="flex-grow">
        <!-- Top Navy Banner -->
        <section class="bg-[#12264A] text-white py-14 border-b border-gray-800">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                <h1 id="banner-title" class="text-3xl md:text-5xl font-serif font-bold tracking-tight text-white leading-tight"></h1>
                <div class="w-16 h-1 bg-[#E0B24D] mx-auto mt-4"></div>
            </div>
        </section>

        <!-- Center Detail Content -->
        <article class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
            <!-- Breadcrumbs -->
            <div class="flex items-center space-x-2 text-xs text-gray-500 mb-8 uppercase tracking-wider">
                <a href="/peanuts.html" class="hover:text-[#114B74]">Home</a>
                <span>/</span>
                <a href="/centers/centers.html" class="hover:text-[#114B74]">Centers</a>
                <span>/</span>
                <span id="breadcrumb-center" class="text-gray-700 font-semibold"></span>
            </div>

            <!-- Overview Header -->
            <div class="border-b border-gray-200 pb-8 mb-10">
                <span id="center-badge" class="inline-block bg-[#114B74] text-white text-xs font-bold px-2.5 py-1 mb-4 uppercase tracking-wider rounded"></span>
                <h2 id="center-name" class="text-3xl md:text-4xl font-serif font-bold text-[#12264A] leading-tight mb-3"></h2>
                <p id="center-slogan" class="text-base font-semibold text-[#114B74] leading-relaxed mb-4"></p>
                <div class="bg-gray-50 border-l-4 border-[#E0B24D] p-4 text-xs text-gray-600">
                    <strong>Leadership:</strong> <span id="center-lead"></span>
                </div>
            </div>

            <!-- Description Body -->
            <div id="center-body" class="prose prose-lg max-w-none text-gray-700 leading-relaxed font-normal space-y-6"></div>

            <!-- Key Publications Section -->
            <div id="pubs-section" class="mt-12 pt-8 border-t border-gray-200">
                <h3 class="text-2xl font-serif font-bold text-[#12264A] mb-4">Representative Publications</h3>
                <ul id="pubs-list" class="space-y-3 text-sm text-gray-700"></ul>
            </div>

            <!-- Back to Centers List Button -->
            <div class="mt-14 pt-8 border-t border-gray-200 flex justify-between items-center">
                <a href="/centers/centers.html" class="inline-flex items-center text-sm font-semibold text-[#114B74] hover:text-[#E0B24D] transition-colors">
                    ← Back to All Centers
                </a>
                <a href="/peanuts.html" class="text-xs text-gray-500 hover:text-gray-900 transition-colors">
                    Go to Home
                </a>
            </div>
        </article>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <script src="/centers/centers.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch('/header.html').then(r => r.text()).then(h => document.getElementById('header-container').innerHTML = h);
            fetch('/footer.html').then(r => r.text()).then(f => document.getElementById('footer-container').innerHTML = f);

            const id = new URLSearchParams(window.location.search).get('id');
            const center = (typeof CENTERS_DATA !== 'undefined')
                ? (CENTERS_DATA.find(c => c.id === id) || CENTERS_DATA[0])
                : null;

            if (center) {
                document.title = `${center.name} - IAIS`;
                document.getElementById('banner-title').textContent = center.name;
                document.getElementById('breadcrumb-center').textContent = center.shortName;
                document.getElementById('center-badge').textContent = center.badge;
                document.getElementById('center-name').textContent = center.name;
                document.getElementById('center-slogan').textContent = center.slogan;
                document.getElementById('center-lead').textContent = center.lead;
                document.getElementById('center-body').innerHTML = center.description;

                const pubsList = document.getElementById('pubs-list');
                if (center.keyPapers && center.keyPapers.length > 0) {
                    pubsList.innerHTML = center.keyPapers.map(p => `
                        <li class="bg-white p-4 border border-gray-100 rounded shadow-sm flex items-start gap-3">
                            <span class="text-[#E0B24D] font-bold">▪</span>
                            <span class="text-gray-800 leading-relaxed">${p}</span>
                        </li>
                    `).join('');
                } else {
                    document.getElementById('pubs-section').style.display = 'none';
                }
            }
        });
    </script>
</body>
</html>
