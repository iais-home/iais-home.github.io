<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Research Centers - IAIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Public Sans', sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        h1, h2, h3, .font-serif { font-family: 'Source Serif 4', serif; }
    </style>
</head>
<body class="bg-[#FAFBFD] text-gray-800">
    <div id="header-container"></div>

    <main class="flex-grow max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-16 w-full">
        <div class="mb-12 border-b border-gray-200 pb-4">
            <span class="text-xs font-bold tracking-widest text-[#E0B24D] uppercase">Institutes & Labs</span>
            <h1 class="text-3xl md:text-4xl font-serif font-bold text-[#12264A] mt-1">Research Centers</h1>
        </div>

        <div id="centers-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
    </main>

    <div id="footer-container"></div>

    <script src="/centers/centers.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch('/header.html').then(r => r.text()).then(h => document.getElementById('header-container').innerHTML = h);
            fetch('/footer.html').then(r => r.text()).then(f => document.getElementById('footer-container').innerHTML = f);

            document.getElementById('centers-grid').innerHTML = CENTERS_DATA.map(c => `
                <div class="bg-white p-8 rounded shadow-sm border-t-4 border-[#114B74] hover:shadow-md transition-shadow flex flex-col justify-between">
                    <div>
                        <h2 class="text-2xl font-serif font-bold text-[#12264A] mb-2">${c.name}</h2>
                        <p class="text-xs font-semibold text-[#114B74] mb-4">${c.slogan}</p>
                        <p class="text-sm text-gray-600 leading-relaxed mb-6">${c.description}</p>
                    </div>
                    <a href="/centers/center-detail.html?id=${c.id}" class="text-xs font-bold text-[#114B74] hover:text-[#E0B24D] tracking-wider uppercase">
                        Center Overview →
                    </a>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
