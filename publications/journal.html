<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Research Papers - IAIS Publications</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Public Sans', sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        h1, h2, h3, .font-serif { font-family: 'Source Serif 4', serif; }
    </style>
</head>
<body class="bg-[#FAFBFD] text-gray-800">
    <div id="header-container"></div>

    <main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-16 w-full">
        <div class="mb-10 border-b border-gray-200 pb-4">
            <span class="text-xs font-bold tracking-widest text-[#E0B24D] uppercase">Publications</span>
            <h1 class="text-3xl md:text-4xl font-serif font-bold text-[#12264A] mt-1">Research Papers</h1>
        </div>

        <!-- Papers Container -->
        <div id="papers-list" class="space-y-6"></div>
    </main>

    <div id="footer-container"></div>

    <!-- 데이터 주입 및 렌더링 -->
    <script src="/publications/journal.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Header/Footer Component Loading
            fetch('/header.html').then(r => r.text()).then(h => document.getElementById('header-container').innerHTML = h);
            fetch('/footer.html').then(r => r.text()).then(f => document.getElementById('footer-container').innerHTML = f);

            // Render Journal Cards
            const container = document.getElementById('papers-list');
            container.innerHTML = JOURNAL_PAPERS.map(p => `
                <div class="bg-white p-6 rounded shadow-sm border border-gray-100 hover:border-[#114B74] transition-all">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="bg-[#12264A] text-white text-[10px] font-bold px-2 py-0.5 rounded">${p.year}</span>
                        <span class="text-xs text-[#114B74] font-medium">${p.venue}</span>
                    </div>
                    <a href="/publications/journal-detail.html?id=${p.id}" class="block group">
                        <h2 class="text-xl font-serif font-bold text-[#12264A] group-hover:text-[#114B74] transition-colors mb-2">
                            ${p.title}
                        </h2>
                    </a>
                    <p class="text-xs text-gray-600 mb-3">${p.authors}</p>
                    <p class="text-sm text-gray-500 line-clamp-2">${p.abstract}</p>
                    <div class="mt-4 flex gap-4 text-xs font-bold">
                        <a href="/publications/journal-detail.html?id=${p.id}" class="text-[#114B74] hover:text-[#E0B24D]">View Details →</a>
                        <a href="${p.doi}" target="_blank" class="text-gray-400 hover:text-gray-700">DOI ↗</a>
                    </div>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
