<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conferences &amp; Workshops - IAIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Public Sans', sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        h1, h2, h3, h4, .font-serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
</head>
<body class="bg-[#FAFBFD] text-gray-800">
    <div id="header-container"></div>

    <main class="flex-grow">
        <!-- Top Navy Banner -->
        <section class="bg-[#12264A] text-white py-14 border-b border-gray-800">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                <h1 class="text-4xl md:text-5xl font-serif font-bold tracking-tight text-white">Conferences &amp; Workshops</h1>
                <div class="w-16 h-1 bg-[#E0B24D] mx-auto mt-4"></div>
            </div>
        </section>

        <!-- Papers List Section -->
        <section class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
            <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 mb-8 border-b border-gray-200 pb-4">
                <p id="papers-count" class="text-sm text-gray-500 font-medium"></p>
                <input id="papers-search" type="search" placeholder="Search title, author or venue"
                       class="w-full sm:w-72 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#114B74]">
            </div>

            <div id="papers-list" class="space-y-12"></div>
        </section>
    </main>

    <div id="footer-container"></div>

    <script src="/publications/conf.js"></script>
    <script>
        const PAPERS = (typeof CONF_PAPERS !== 'undefined') ? CONF_PAPERS : [];
        const DETAIL_PAGE = '/publications/conf-detail.html';
        const LABEL = 'conference and workshop papers';

        function paperCard(p) {
            return `
                <article class="bg-white p-6 sm:p-8 rounded shadow-sm border border-gray-100 hover:border-[#114B74] transition-all group flex flex-col md:flex-row justify-between gap-6">
                    <div class="flex-grow">
                        <div class="flex flex-wrap items-center gap-2 mb-3">
                            ${p.type ? `<span class="bg-[#114B74] text-white text-[10px] font-bold px-2.5 py-0.5 uppercase tracking-wider rounded">${p.type}</span>` : ''}
                            ${p.award ? `<span class="bg-[#E0B24D] text-[#12264A] text-[10px] font-bold px-2.5 py-0.5 uppercase tracking-wider rounded">${p.award}</span>` : ''}
                            <span class="text-xs text-[#114B74] font-semibold">${p.venue}</span>
                        </div>
                        <a href="${DETAIL_PAGE}?id=${p.id}" class="block">
                            <h3 class="text-xl md:text-2xl font-serif font-bold text-[#12264A] group-hover:text-[#114B74] transition-colors mb-2 leading-snug">${p.title}</h3>
                        </a>
                        <p class="text-xs text-gray-600 mb-3">${p.authors}</p>
                        <p class="text-sm text-gray-500 line-clamp-2">${p.abstract}</p>
                    </div>
                    <div class="flex-shrink-0 self-start md:self-center flex flex-col gap-2">
                        <a href="${DETAIL_PAGE}?id=${p.id}" class="inline-flex items-center text-xs font-bold text-[#114B74] group-hover:text-[#E0B24D] uppercase tracking-wider">View Details →</a>
                        ${p.doi ? `<a href="${p.doi}" target="_blank" rel="noopener" class="inline-flex items-center text-xs font-bold text-gray-500 hover:text-[#114B74] uppercase tracking-wider">Publication ↗</a>` : ''}
                    </div>
                </article>`;
        }

        function render(query) {
            const q = (query || '').trim().toLowerCase();
            const items = PAPERS.filter(p => !q || [p.title, p.authors, p.venue, p.year].join(' ').toLowerCase().includes(q));
            document.getElementById('papers-count').innerHTML = `Total <strong>${items.length}</strong> ${LABEL}`;

            const years = [...new Set(items.map(p => p.year))].sort((a, b) => b - a);
            document.getElementById('papers-list').innerHTML = years.length ? years.map(y => `
                <div>
                    <h2 class="text-2xl font-serif font-bold text-[#12264A] mb-5 flex items-center gap-3">
                        ${y}
                        <span class="h-[2px] w-10 bg-[#E0B24D]"></span>
                    </h2>
                    <div class="space-y-5">
                        ${items.filter(p => p.year === y).map(paperCard).join('')}
                    </div>
                </div>`).join('') : '<p class="text-gray-500">No publications match your search.</p>';
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetch('/header.html').then(r => r.text()).then(h => document.getElementById('header-container').innerHTML = h);
            fetch('/footer.html').then(r => r.text()).then(f => document.getElementById('footer-container').innerHTML = f);
            render('');
            document.getElementById('papers-search').addEventListener('input', e => render(e.target.value));
        });
    </script>
</body>
</html>
