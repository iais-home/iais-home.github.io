<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty - IAIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Public Sans', sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        h1, h2, h3, h4, .font-serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
</head>
<body class="bg-[#F2F3F5] text-gray-800">
    <!-- Header -->
    <div id="header-container"></div>

    <main class="flex-grow">
        <!-- Top Navy Banner -->
        <section class="bg-[#12264A] text-white py-14 border-b border-gray-800">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                <h1 class="text-4xl md:text-5xl font-serif font-bold tracking-tight text-white">Faculty</h1>
                <div class="w-16 h-1 bg-[#E0B24D] mx-auto mt-4"></div>
            </div>
        </section>

        <!-- SFI-Style 2-Column Faculty Grid (Matching Image 1) -->
        <section class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
            <div id="faculty-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </section>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <script src="/people/faculty.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch('/header.html').then(r => r.text()).then(h => document.getElementById('header-container').innerHTML = h);
            fetch('/footer.html').then(r => r.text()).then(f => document.getElementById('footer-container').innerHTML = f);

            const grid = document.getElementById('faculty-grid');
            if (typeof FACULTY_DATA !== 'undefined') {
                grid.innerHTML = FACULTY_DATA.map(m => `
                    <div class="bg-white p-5 shadow-sm border border-gray-100 flex items-center gap-6 hover:shadow-md transition-shadow">
                        <!-- Photo Left -->
                        <a href="/people/faculty-detail.html?id=${m.id}" class="flex-shrink-0 block w-28 h-28 sm:w-32 sm:h-32 bg-gray-100 overflow-hidden">
                            <img src="${m.photo}" alt="${m.name}" class="w-full h-full object-cover grayscale contrast-105 hover:grayscale-0 transition-all duration-300">
                        </a>

                        <!-- Details Right -->
                        <div class="flex-grow">
                            <a href="/people/faculty-detail.html?id=${m.id}" class="block group">
                                <h2 class="text-xl sm:text-2xl font-serif text-[#1b5368] group-hover:text-[#E0B24D] transition-colors leading-snug mb-1">
                                    ${m.name}
                                </h2>
                            </a>
                            <p class="text-sm text-gray-700 font-normal leading-snug mb-2">
                                ${m.title}
                            </p>
							<p class="text-sm text-gray-700 font-normal leading-snug mb-2">
                                ${m.subTitle}
                            </p>
                            <a href="${m.website}" target="_blank" class="text-xs text-[#b07d4b] hover:text-[#12264A] transition-colors font-medium">
                                Personal Website
                            </a>
                        </div>
                    </div>
                `).join('');
            }
        });
    </script>
</body>
</html>
