<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAIS - Institute for Advanced Intelligence Study</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            letter-spacing: -0.01em;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        h1, h2, h3, h4, .font-serif {
            font-family: 'Source Serif 4', Georgia, serif;
            letter-spacing: -0.015em;
        }
        .slider-container { overflow: hidden; position: relative; }
        .slider-track { display: flex; transition: transform 0.5s ease-in-out; }
        .slide { min-width: 100%; box-sizing: border-box; }
        .slider-dots { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.4); cursor: pointer; transition: 0.3s; }
        .dot.active { background: #E0B24D; transform: scale(1.2); }
    </style>
</head>
<body class="bg-[#FAFBFD] text-gray-800">
    <!-- Header -->
    <div id="header-container"></div>

    <main class="flex-grow">
        <!-- Hero Slider Section -->
        <section class="slider-container relative bg-[#12264A] text-white overflow-hidden h-[420px] md:h-[500px]">
            <div class="slider-track h-full" id="sliderTrack">
                <!-- Javascript will populate this -->
            </div>
            <div class="slider-dots" id="sliderDots">
                <!-- Javascript will populate this -->
            </div>
        </section>

        <!-- 1. News Section -->
        <section class="pt-16 pb-12 bg-white">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-end mb-8 border-b border-gray-200 pb-3">
                    <div>
                        <h2 class="text-3xl font-serif font-bold text-[#12264A] inline-block relative">
                            News
                            <span class="block h-[3px] w-12 bg-[#E0B24D] mt-2"></span>
                        </h2>
                    </div>
                    <a href="/news/whats-new.html" class="text-xs font-bold tracking-wider text-[#114B74] hover:text-[#E0B24D] transition-colors flex items-center gap-1">
                        MORE NEWS <span class="text-base leading-none font-bold">+</span>
                    </a>
                </div>
                
                <div id="home-news-grid" class="grid grid-cols-1 md:grid-cols-4 gap-8">
                    <!-- Javascript will populate this -->
                </div>
            </div>
        </section>

        <!-- 2. Research Section -->
        <section class="pt-8 pb-16 bg-white">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-end mb-8 border-b border-gray-200 pb-3">
                    <div>
                        <h2 class="text-3xl font-serif font-bold text-[#12264A] inline-block relative">
                            Research Centers
                            <span class="block h-[3px] w-12 bg-[#E0B24D] mt-2"></span>
                        </h2>
                    </div>
                    <a href="/centers/centers.html" class="text-xs font-bold tracking-wider text-[#114B74] hover:text-[#E0B24D] transition-colors flex items-center gap-1">
                        ALL CENTERS <span class="text-base leading-none font-bold">+</span>
                    </a>
                </div>

                <div id="home-centers-grid" class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <!-- Javascript will populate this -->
                </div>
            </div>
        </section>

        
    
        <!-- 4. About IAIS Section -->
        <section class="py-16 bg-white border-t border-gray-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-end mb-8 border-b border-gray-200 pb-3">
                    <div>
                        <h2 class="text-3xl font-serif font-bold text-[#12264A] inline-block relative">
                            About IAIS
                            <span class="block h-[3px] w-12 bg-[#E0B24D] mt-2"></span>
                        </h2>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- Mission and History Card -->
                    <a href="/about/mission.html" class="group relative h-64 flex flex-col items-center justify-center text-center overflow-hidden rounded shadow-sm hover:shadow-lg transition-all">
                        <!-- Background Image -->
                        <div class="absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover:scale-105" style="background-image: url('https://images.unsplash.com/photo-1559757175-5700dde675bc?auto=format&fit=crop&w=800&q=80');"></div>
                        <!-- Dark Overlay -->
                        <div class="absolute inset-0 bg-[#12264A]/70 group-hover:bg-[#12264A]/50 transition-colors duration-300"></div>
                        <!-- Content -->
                        <h3 class="relative z-10 text-2xl font-serif font-bold text-white group-hover:text-[#E0B24D] transition-colors tracking-wide">
                            Mission & History
                        </h3>
                    </a>
                    
                    <!-- Organisation Card -->
                    <a href="/about/organisation.html" class="group relative h-64 flex flex-col items-center justify-center text-center overflow-hidden rounded shadow-sm hover:shadow-lg transition-all">
                        <!-- Background Image -->
                        <div class="absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover:scale-105" style="background-image: url('https://images.unsplash.com/photo-1517048676732-d65bc937f952?auto=format&fit=crop&w=800&q=80');"></div>
                        <!-- Dark Overlay -->
                        <div class="absolute inset-0 bg-[#114B74]/70 group-hover:bg-[#114B74]/50 transition-colors duration-300"></div>
                        <!-- Content -->
                        <h3 class="relative z-10 text-2xl font-serif font-bold text-white group-hover:text-[#E0B24D] transition-colors tracking-wide">
                            Organisation
                        </h3>
                    </a>
                    
                    <!-- Collaborators Card -->
                    <a href="/about/collaborators.html" class="group relative h-64 flex flex-col items-center justify-center text-center overflow-hidden rounded shadow-sm hover:shadow-lg transition-all">
                        <!-- Background Image -->
                        <div class="absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover:scale-105" style="background-image: url('https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=800&q=80');"></div>
                        <!-- Dark Overlay -->
                        <div class="absolute inset-0 bg-gray-900/70 group-hover:bg-gray-900/50 transition-colors duration-300"></div>
                        <!-- Content -->
                        <h3 class="relative z-10 text-2xl font-serif font-bold text-white group-hover:text-[#E0B24D] transition-colors tracking-wide">
                            Collaborators
                        </h3>
                    </a>
                </div>
            </div>
        </section>

    
        <!-- 5. Job Openings Section -->
        <section class="py-16 bg-[#F4F6F9] border-t border-gray-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-end mb-8 border-b border-gray-300 pb-3">
                    <div>
                        <h2 class="text-3xl font-serif font-bold text-[#12264A] inline-block relative">
                            Job Openings
                            <span class="block h-[3px] w-12 bg-[#E0B24D] mt-2"></span>
                        </h2>
                    </div>
                </div>

                <div id="home-jobs-list" class="space-y-4">
                    <div class="bg-white p-6 md:p-8 shadow-sm border border-gray-100 text-center">
                        <p class="text-gray-500 font-medium">No openings at the moment.</p>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Data Scripts -->
    <script src="/publications/journal.js"></script>
    <!-- Data Scripts -->
    <script src="/centers/centers.js"></script>
    <script src="/news/hero-slider.js"></script>
    <script src="/news/news-data.js"></script>
    <script src="/news/activities.js"></script>

    <script>
        // 1. 공통 헤더/푸터 로드
        async function loadComponents() {
            try {
                const headerRes = await fetch('/header.html');
                if (headerRes.ok) document.getElementById('header-container').innerHTML = await headerRes.text();
                
                const footerRes = await fetch('/footer.html');
                if (footerRes.ok) document.getElementById('footer-container').innerHTML = await footerRes.text();
            } catch (e) {
                console.error("Component load failed:", e);
            }
        }

        // 2. 메인 화면 News 섹션 자동 렌더링
        function renderHomeNews() {
            const container = document.getElementById('home-news-grid');
            if (!container || typeof NEWS_DATA === 'undefined') return;

            const latestFour = NEWS_DATA.slice(0, 4);
            container.innerHTML = latestFour.map(item => `
                <div class="flex flex-col justify-between group">
                    <div>
                        <span class="text-[11px] font-bold tracking-wider text-gray-500 uppercase block mb-3">${item.category}</span>
                        <a href="/news/news-detail.html?id=${item.id}" class="block">
                            <h3 class="text-[17px] font-serif font-bold text-[#114B74] group-hover:text-[#E0B24D] transition-colors leading-snug mb-3">
                                ${item.title}
                            </h3>
                        </a>
                        <p class="text-sm text-gray-600 leading-relaxed line-clamp-3 font-normal">${item.summary}</p>
                    </div>
                    <span class="text-xs text-gray-400 mt-4 block font-medium">${item.date}</span>
                </div>
            `).join('');
        }

        
        // 메인 화면 Centers 섹션 자동 렌더링
        function renderHomeCenters() {
            const container = document.getElementById('home-centers-grid');
            if (!container || typeof CENTERS_DATA === 'undefined') return;

            // Define background colors for the 4 centers
            const bgColors = ["bg-[#12264A]", "bg-[#114B74]", "bg-[#3B4558]", "bg-[#DCA642]"];
            const textColors = ["text-white", "text-white", "text-white", "text-[#12264A]"];
            const hoverColors = ["group-hover:text-[#E0B24D]", "group-hover:text-[#E0B24D]", "group-hover:text-[#E0B24D]", "group-hover:text-black"];
            const pColors = ["text-gray-300", "text-blue-100", "text-gray-300", "text-[#12264A]/80"];

            container.innerHTML = CENTERS_DATA.slice(0, 4).map((c, i) => `
                <a href="/centers/center-detail.html?id=${c.id}" class="group relative ${bgColors[i]} h-52 flex flex-col items-center justify-center p-6 text-center shadow-sm hover:shadow-lg transition-all transform hover:-translate-y-1">
                    <h3 class="text-2xl font-serif font-bold ${textColors[i]} ${hoverColors[i]} transition-colors leading-tight">
                        ${c.shortName}
                    </h3>
                    <p class="text-xs ${pColors[i]} mt-3 font-medium max-w-xs leading-relaxed">
                        ${c.slogan}
                    </p>
                </a>
            `).join('');
        }

        
        // 메인 화면 Research(Publications) 자동 렌더링
        function renderHomeResearch() {
            const container = document.getElementById('home-research-list');
            if (!container || typeof JOURNAL_PAPERS === 'undefined') return;

            const latestThree = JOURNAL_PAPERS.slice(0, 3);
            container.innerHTML = latestThree.map(p => `
                <article class="bg-white p-6 shadow-sm border border-gray-100 hover:border-[#114B74] transition-all group flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                    <div class="flex-grow">
                        <div class="flex items-center gap-3 mb-2">
                            <span class="bg-[#12264A] text-white text-[10px] font-bold px-2 py-0.5 uppercase tracking-wider rounded">${p.year}</span>
                            <span class="text-xs text-[#114B74] font-semibold">${p.venue}</span>
                        </div>
                        <a href="/publications/journal-detail.html?id=${p.id}" class="block">
                            <h3 class="text-lg md:text-xl font-serif font-bold text-[#12264A] group-hover:text-[#E0B24D] transition-colors leading-snug mb-1">
                                ${p.title}
                            </h3>
                        </a>
                        <p class="text-xs text-gray-600 line-clamp-1">${p.authors}</p>
                    </div>
                    <div class="flex-shrink-0 self-start md:self-center">
                        <a href="/publications/journal-detail.html?id=${p.id}" class="inline-flex items-center text-xs font-bold text-[#114B74] group-hover:text-[#E0B24D] uppercase tracking-wider">
                            View Details →
                        </a>
                    </div>
                </article>
            `).join('');
        }
// 4. 슬라이더 동적 렌더링
        function renderHeroSlider() {
            const track = document.getElementById('sliderTrack');
            const dotsContainer = document.getElementById('sliderDots');
            if (!track || typeof HERO_SLIDER_DATA === 'undefined') return;

            track.innerHTML = HERO_SLIDER_DATA.map((slide, index) => `
                <div class="slide relative h-full flex flex-col justify-center px-8 md:px-24 ${slide.bgColor}">
                    ${index === 0 ? '<div class="absolute inset-0 bg-[#12264A] opacity-95 z-0"></div>' : ''}
                    <div class="relative z-10 max-w-4xl">
                        <span class="inline-block ${slide.badgeColor} text-xs font-bold px-3 py-1 mb-6 tracking-wider uppercase">${slide.badge}</span>
                        <h2 class="text-3xl md:text-5xl lg:text-6xl font-serif font-bold leading-tight mb-6">${slide.title}</h2>
                        <p class="text-base md:text-lg text-gray-200 mb-8 max-w-2xl font-normal leading-relaxed">${slide.description}</p>
                        <a href="${slide.buttonLink}" class="inline-flex items-center justify-center font-semibold py-3 px-8 transition-colors duration-200 w-fit text-sm ${slide.buttonColor}">
                            ${slide.buttonText}
                        </a>
                    </div>
                </div>
            `).join('');

            dotsContainer.innerHTML = HERO_SLIDER_DATA.map((_, index) => `
                <span class="dot ${index === 0 ? 'active' : ''}" onclick="goToSlide(${index})"></span>
            `).join('');
            
            // 전역 변수 초기화 (슬라이더 개수 동기화)
            totalSlides = HERO_SLIDER_DATA.length;
        }

        // 5. 슬라이더 동작 로직
        let currentSlide = 0;
        let totalSlides = 0;
        let slideInterval;

        function updateSlider() {
            const track = document.getElementById('sliderTrack');
            const dots = document.querySelectorAll('.dot');
            if(!track) return;
            track.style.transform = `translateX(-${currentSlide * 100}%)`;
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentSlide);
            });
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            updateSlider();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateSlider();
            clearInterval(slideInterval);
            slideInterval = setInterval(nextSlide, 5000);
        }

        // 실행
        document.addEventListener("DOMContentLoaded", () => {
            loadComponents();
            renderHeroSlider();
            renderHomeNews();
            renderHomeActivities();
            renderHomeCenters();
            slideInterval = setInterval(nextSlide, 5000);
        });
    
// Mobile Menu Delegation Logic
document.addEventListener('click', function(e) {
    // Open Menu
    const menuBtn = e.target.closest('#mobile-menu-btn');
    if (menuBtn) {
        const mobileMenu = document.getElementById('mobile-menu');
        if (mobileMenu) {
            mobileMenu.classList.remove('hidden');
            mobileMenu.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }
        return;
    }

    // Close Menu
    const closeBtn = e.target.closest('#mobile-close-btn');
    if (closeBtn) {
        const mobileMenu = document.getElementById('mobile-menu');
        if (mobileMenu) {
            mobileMenu.classList.add('hidden');
            mobileMenu.classList.remove('flex');
            document.body.style.overflow = '';
        }
        return;
    }

    // Accordion Logic
    const toggleBtn = e.target.closest('.mobile-menu-toggle');
    if (toggleBtn) {
        // Prevent if clicking View All link inside the button
        if(e.target.tagName === 'A') return;
        
        const targetId = toggleBtn.getAttribute('data-target');
        const targetList = document.getElementById(targetId);
        const icon = toggleBtn.querySelector('svg');
        
        if (targetList) {
            if (targetList.classList.contains('hidden')) {
                targetList.classList.remove('hidden');
                targetList.classList.add('flex');
                if (icon) icon.classList.add('rotate-180');
            } else {
                targetList.classList.add('hidden');
                targetList.classList.remove('flex');
                if (icon) icon.classList.remove('rotate-180');
            }
        }
    }
});

</script>
</body>
</html>
