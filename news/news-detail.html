<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Detail - IAIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Public Sans', sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        h1, h2, h3, h4, .font-serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
</head>
<body class="bg-[#FAFBFD] text-gray-800">
    <div id="header-container"></div>

    <main class="flex-grow">
        <!-- Top Navy Banner -->
        <section class="bg-[#12264A] text-white py-14 border-b border-gray-800">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                <h1 class="text-4xl md:text-5xl font-serif font-bold tracking-tight text-white">What's New</h1>
                <div class="w-16 h-1 bg-[#E0B24D] mx-auto mt-4"></div>
            </div>
        </section>

        <!-- Article Content -->
        <article class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
            <div class="flex items-center space-x-2 text-xs text-gray-500 mb-8 uppercase tracking-wider">
                <a href="/peanuts.html" class="hover:text-[#114B74]">Home</a>
                <span>/</span>
                <a href="/news/whats-new.html" class="hover:text-[#114B74]">News</a>
                <span>/</span>
                <span id="breadcrumb-cat" class="text-gray-700 font-semibold"></span>
            </div>

            <div class="border-b border-gray-200 pb-8 mb-10">
                <span id="article-cat" class="inline-block bg-[#114B74] text-white text-xs font-bold px-2.5 py-1 mb-4 uppercase tracking-wider rounded"></span>
                <h2 id="article-title" class="text-3xl md:text-4xl font-serif font-bold text-[#12264A] leading-tight mb-4"></h2>
                <div class="flex items-center text-sm text-gray-500 space-x-4">
                    <span>Published: <strong id="article-date"></strong></span>
                </div>
            </div>

            <div id="article-body" class="prose prose-lg max-w-none text-gray-700 leading-relaxed space-y-6"></div>

            <div class="mt-14 pt-8 border-t border-gray-200 flex justify-between items-center">
                <a href="/news/whats-new.html" class="inline-flex items-center text-sm font-semibold text-[#114B74] hover:text-[#E0B24D] transition-colors">
                    ← Back to News List
                </a>
                <a href="/peanuts.html" class="text-xs text-gray-500 hover:text-gray-900 transition-colors">
                    Go to Home
                </a>
            </div>
        </article>
    </main>

    <div id="footer-container"></div>

    <script src="/news/news-data.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch('/header.html').then(r => r.text()).then(h => document.getElementById('header-container').innerHTML = h);
            fetch('/footer.html').then(r => r.text()).then(f => document.getElementById('footer-container').innerHTML = f);

            const id = new URLSearchParams(window.location.search).get('id');
            const article = NEWS_DATA.find(item => item.id === id) || NEWS_DATA[0];

            document.title = `${article.title} - IAIS`;
            document.getElementById('breadcrumb-cat').textContent = article.category;
            document.getElementById('article-cat').textContent = article.category;
            document.getElementById('article-title').textContent = article.title;
            document.getElementById('article-date').textContent = article.date;
            document.getElementById('article-body').innerHTML = article.content;
        });
    </script>
</body>
</html>
