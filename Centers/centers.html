<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Centers - IAIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Public Sans', sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        h1, h2, h3, h4, .font-serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
</head>
<body class="bg-[#FAFBFD] text-gray-800">
    <!-- Header -->
    <div id="header-container"></div>

    <main class="flex-grow">
        <!-- Top Navy Banner (Matching Image Style) -->
        <section class="bg-[#12264A] text-white py-14 border-b border-gray-800">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                <h1 class="text-4xl md:text-5xl font-serif font-bold tracking-tight text-white">Research Centers</h1>
                <div class="w-16 h-1 bg-[#E0B24D] mx-auto mt-4"></div>
            </div>
        </section>

        <!-- Centers List Section -->
        <section class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
            <div class="flex justify-between items-center mb-8 border-b border-gray-200 pb-4">
                <p id="centers-count" class="text-sm text-gray-500 font-medium"></p>
                <div class="text-xs uppercase tracking-wider text-gray-400 font-semibold">Specialized Research Divisions</div>
            </div>

            <!-- 2x2 Grid of Centers -->
            <div id="centers-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
        </section>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <script src="/centers/centers.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch('/header.html').then(r => r.text()).then(h => document.getElementById('header-container').innerHTML = h);
            fetch('/footer.html').then(r => r.text()).then(f => document.getElementById('footer-container').innerHTML = f);

            const countEl = document.getElementById('centers-count');
            const gridEl = document.getElementById('centers-grid');

            if (typeof CENTERS_DATA !== 'undefined') {
                countEl.innerHTML = `Total <strong>${CENTERS_DATA.length}</strong> research centers`;
                gridEl.innerHTML = CENTERS_DATA.map(c => `
                    <article class="bg-white p-8 rounded shadow-sm border-t-4 border-[#114B74] border-x border-b border-gray-100 hover:shadow-md transition-shadow flex flex-col justify-between group">
                        <div>
                            <div class="flex items-center gap-2 mb-3">
                                <span class="bg-[#12264A] text-[#E0B24D] text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">${c.badge}</span>
                            </div>
                            <a href="/centers/center-detail.html?id=${c.id}" class="block">
                                <h2 class="text-2xl font-serif font-bold text-[#12264A] group-hover:text-[#114B74] transition-colors mb-2 leading-snug">
                                    ${c.name}
                                </h2>
                            </a>
                            <p class="text-xs font-semibold text-[#114B74] mb-4">${c.slogan}</p>
                            <p class="text-sm text-gray-600 leading-relaxed mb-6 font-normal">${c.summary}</p>
                        </div>
                        <div class="pt-4 border-t border-gray-100 flex justify-between items-center">
                            <span class="text-xs text-gray-400 font-medium">${c.lead}</span>
                            <a href="/centers/center-detail.html?id=${c.id}" class="inline-flex items-center text-xs font-bold text-[#114B74] group-hover:text-[#E0B24D] uppercase tracking-wider">
                                Explore Center →
                            </a>
                        </div>
                    </article>
                `).join('');
            }
        });
    </script>
</body>
</html>
